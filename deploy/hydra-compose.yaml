name: mapacy

services:
  db:
    image: postgres:16-alpine
    container_name: mapacy-db
    restart: unless-stopped
    env_file:
      - /home/rodrigo/.local/share/mapacy/db.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - frontend
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mapacy:local
    container_name: mapacy
    restart: unless-stopped
    env_file:
      - /home/rodrigo/.local/share/mapacy/app.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      MAPACY_SEED_PATH: /seed/initial-state.json
    expose:
      - "8050"
    volumes:
      - /home/rodrigo/.local/share/mapacy/seed/initial-state.json:/seed/initial-state.json:ro
    tmpfs:
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8050/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - frontend

networks:
  frontend:
    external: true
    name: docker_network

volumes:
  postgres_data:
    name: mapacy-postgres-data
