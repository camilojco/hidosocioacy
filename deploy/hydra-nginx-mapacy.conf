limit_req_zone "$http_cf_connecting_ip$remote_addr" zone=mapacy_login:10m rate=10r/m;

server {
    listen 80;
    server_name mapacy.romagal.com;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /api/login {
        limit_req zone=mapacy_login burst=5 nodelay;
        set $mapacy_upstream http://mapacy:8050;
        proxy_pass $mapacy_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        set $mapacy_upstream http://mapacy:8050;
        proxy_pass $mapacy_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
