<title>Censo Hidrosocial Acaray-Yguazú</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/*__LEAFLET_CSS__*/
</style>
<style>
/* Layout: aplicación de pantalla completa — barra superior, panel de fichas a la izquierda, mapa al centro, ficha a la derecha.
   Lenguaje visual: carta topográfica de relevamiento (tierra verde-gris, agua apagada, tinta petróleo) */
:root{
  --bg:#f3f4ef; --panel:#fbfbf8; --panel-2:#eef0e8; --line:#d9dccf; --line-2:#c6cabb;
  --ink:#16201d; --ink-2:#47524c; --ink-3:#717b74;
  --accent:#0d5b63; --accent-ink:#ffffff; --accent-soft:#d9ebea;
  --land:#eef0e8; --water:#b4cfde; --water-line:#7ea6bd; --boundary:#aeb4a3; --dlabel:#6a7268; --road:#c9b9a0;
  --mark-ring:#fbfbf8;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --cgray:#8f948c; --scen:#2a78d6; --water-lvl:#8db7d3; --station:#5a2d82;
  --o1:#e4864f; --o2:#c95a33; --o3:#a03a22; --o4:#661b12;
  --warn:#9a5b00; --warn-bg:#fdf1d8; --bad:#a83232; --bad-bg:#f9e2df; --good:#1d6b3a; --good-bg:#dff0e3;
  --shadow:0 1px 2px rgba(22,32,29,.06),0 8px 24px rgba(22,32,29,.10);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101416; --panel:#161b1e; --panel-2:#1d2326; --line:#2a3236; --line-2:#3a4448;
  --ink:#e8ece8; --ink-2:#b4bdb7; --ink-3:#86908a;
  --accent:#6cc4c9; --accent-ink:#082427; --accent-soft:#173539;
  --land:#1c2024; --water:#1f3a4d; --water-line:#3a6884; --boundary:#3c464a; --dlabel:#86908a; --road:#4a4436;
  --mark-ring:#101416;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --cgray:#7c837e; --scen:#3987e5; --water-lvl:#2f6283; --station:#c9a6ef;
  --o1:#b8442a; --o2:#d9653b; --o3:#ee9363; --o4:#f8c49c;
  --warn:#f0b54a; --warn-bg:#3a2c10; --bad:#ef8a80; --bad-bg:#3d1c1a; --good:#7dd39b; --good-bg:#16301f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101416; --panel:#161b1e; --panel-2:#1d2326; --line:#2a3236; --line-2:#3a4448;
  --ink:#e8ece8; --ink-2:#b4bdb7; --ink-3:#86908a;
  --accent:#6cc4c9; --accent-ink:#082427; --accent-soft:#173539;
  --land:#1c2024; --water:#1f3a4d; --water-line:#3a6884; --boundary:#3c464a; --dlabel:#86908a; --road:#4a4436;
  --mark-ring:#101416;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --cgray:#7c837e; --scen:#3987e5; --water-lvl:#2f6283; --station:#c9a6ef;
  --o1:#b8442a; --o2:#d9653b; --o3:#ee9363; --o4:#f8c49c;
  --warn:#f0b54a; --warn-bg:#3a2c10; --bad:#ef8a80; --bad-bg:#3d1c1a; --good:#7dd39b; --good-bg:#16301f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.45);
  color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}

/* ---------- barra superior ---------- */
.top{display:flex;align-items:center;gap:16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brandwrap{display:flex;align-items:center;gap:12px;min-width:0;margin-right:auto}
.logo{height:46px;width:auto;flex:none;border-radius:2px;display:block}
.brand{display:flex;flex-direction:column;min-width:0}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.05;letter-spacing:.01em}
.brand h1 span{color:var(--accent)}
.source{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);padding:5px 10px;border:1px dashed var(--line-2);border-radius:999px;white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
.source b{font-weight:600;color:var(--ink)}
.dot-demo{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.dot-live{background:var(--good)}
.tbar{display:flex;gap:6px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--panel);cursor:pointer;font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn.small{height:28px;padding:0 9px;font-size:12.5px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{width:34px;padding:0;justify-content:center}

/* ---------- cuerpo ---------- */
.main{position:relative;display:grid;grid-template-columns:360px 1fr;min-height:0;overflow:hidden}
.side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line);z-index:5}
.tabs{display:flex;gap:2px;padding:10px 14px 0;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:8px 10px 9px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.03em;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.stat{background:var(--panel);padding:10px 12px 9px;min-width:0;cursor:pointer;border:0;text-align:left}
.stat:hover{background:var(--panel-2)}
.stat[aria-pressed="true"]{background:var(--accent-soft)}
.stat .n{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1}
.stat .l{font-size:11px;color:var(--ink-3);line-height:1.25;margin-top:4px}
.stat .n small{font-size:13px;color:var(--ink-3);font-weight:600}
.filters{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.search{position:relative}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-3)}
.search input{width:100%;height:34px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--bg);padding:0 10px 0 32px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{height:26px;padding:0 9px;border-radius:999px;border:1px solid var(--line-2);background:transparent;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.sel{height:30px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--bg);padding:0 6px;font-size:12.5px;min-width:0;flex:1}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.flabel{font-family:var(--f-display);font-weight:600;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:12.5px;font-weight:500}
.listhead{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-size:12px;color:var(--ink-3);border-bottom:1px solid var(--line)}
.list{flex:1;overflow:auto;min-height:0}
.item{display:grid;grid-template-columns:12px 1fr auto;gap:4px 10px;align-items:start;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left}
.item:hover{background:var(--panel-2)}
.item[aria-current="true"]{background:var(--accent-soft)}
.item .sw{width:10px;height:10px;border-radius:50%;margin-top:4px;box-shadow:0 0 0 1.5px var(--mark-ring),0 0 0 2.5px var(--line-2)}
.item .t1{font-family:var(--f-mono);font-size:12.5px;font-weight:500}
.item .t2{font-size:12.5px;color:var(--ink-2);grid-column:2/4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:11.5px;color:var(--ink-3);text-align:right;white-space:nowrap}
.more{padding:12px 14px}
.empty{padding:28px 18px;color:var(--ink-3);text-align:center}

.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--panel-2);color:var(--ink-2)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

/* resumen */
.summary{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:18px}
.summary h3{margin:0 0 8px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.03em}
.summary .note{font-size:12px;color:var(--ink-3);margin:6px 0 0}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{font-family:var(--f-display);font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line-2)}
table.t td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.summary table.t th.num{white-space:normal;line-height:1.15;width:52px}
.summary table.t{font-size:12px}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:132px 1fr 34px;gap:8px;align-items:center;font-size:12.5px}
.bar .track{height:10px;background:var(--panel-2);border-radius:2px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:0 3px 3px 0}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.bar .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}

/* ---------- mapa ---------- */
.mapwrap{position:relative;min-width:0;min-height:0}
#map{position:absolute;inset:0;background:var(--land);z-index:0}
.leaflet-container{font-family:var(--f-body);background:var(--land)}
.leaflet-bar a{background:var(--panel);color:var(--ink);border-bottom-color:var(--line)}
.leaflet-bar a:hover{background:var(--panel-2)}
.leaflet-bar{border:1px solid var(--line-2)!important;box-shadow:var(--shadow)!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent)!important;color:var(--ink-3)!important;font-size:10.5px}
.leaflet-control-attribution a{color:var(--ink-2)!important}
.leaflet-control-scale-line{background:color-mix(in srgb,var(--panel) 80%,transparent);border-color:var(--ink-2);color:var(--ink-2);font-family:var(--f-mono);font-size:10.5px}
.leaflet-tooltip{background:var(--panel);color:var(--ink);border:1px solid var(--line-2);box-shadow:var(--shadow);font-family:var(--f-body);font-size:12px;padding:5px 8px;border-radius:5px}
.leaflet-tooltip-top:before{border-top-color:var(--panel)}
.dlabel{display:inline-block;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dlabel);white-space:nowrap;text-shadow:0 0 3px var(--land),0 0 3px var(--land),0 0 3px var(--land);transform:translate(-50%,-50%);pointer-events:none}
.dlabel.dep{font-size:11px;opacity:.75}
.wlabel{display:inline-block;font-family:var(--f-display);font-style:italic;font-weight:500;font-size:15px;letter-spacing:.12em;color:var(--water-line);white-space:nowrap;transform:translate(-50%,-50%);pointer-events:none}
.dam svg{display:block}
.map-sat .dlabel{color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
.mcard{position:absolute;z-index:500;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--shadow)}

.scen{left:12px;top:10px;width:370px;max-width:calc(100% - 330px);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.scen-h{display:flex;justify-content:space-between;align-items:center}
.scen-seg{display:flex;flex-wrap:wrap;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.scen-seg button{flex:1 1 auto;border:0;border-right:1px solid var(--line-2);background:transparent;padding:6px 6px;font-size:12.5px;font-family:var(--f-mono);cursor:pointer;white-space:nowrap;display:inline-flex;gap:5px;align-items:center;justify-content:center}
.scen-seg button:first-child{font-family:var(--f-body)}
.scen-seg button:last-child{border-right:0}
.scen-seg button:hover{background:var(--panel-2)}
.scen-seg button[aria-checked="true"]{background:var(--ink);color:var(--panel)}
.scen-seg i{width:9px;height:9px;border-radius:2px;display:inline-block;box-shadow:0 0 0 1px var(--mark-ring)}
.scen-info{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.scen-opts{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.scen-opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.scen-opts .sel{height:26px;flex:none;width:auto}
.scen-opts input{accent-color:var(--accent);margin:0}
.scen-empty{margin:0;font-size:12.5px;color:var(--ink-3)}
.scen-first{font-size:12.5px;margin-bottom:6px}
tr.scen-row-active td{background:var(--accent-soft)}
.main.has-drawer .scen{max-width:calc(100% - 330px - 440px)}
@media (max-width:900px){.scen{max-width:calc(100% - 290px)}}
@media (max-width:620px){.scen{top:52px;left:8px;right:56px;width:auto;max-width:none;padding:8px 10px}.scen .scen-opts{display:none}.layers{right:56px}}

.scen-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-2px 0 0}
.scen-tabs button{border:0;background:transparent;padding:4px 6px 6px;font-size:12.5px;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.scen-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.dotact{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.scen-seg button.sim{text-decoration:underline dotted;text-underline-offset:3px}
.scen-note{font-size:11.5px;color:var(--warn)}
.simtag{font-size:10.5px;color:var(--warn);font-weight:600}
.scen-ficha-g+.scen-ficha-g{margin-top:12px}
.summary .linkbtn{white-space:nowrap}
.sw-site{background:var(--panel)!important;box-shadow:0 0 0 2.4px var(--ink)!important}
.lg-site{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.st-ico{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;background:var(--station);color:var(--panel);font:600 10px/1 var(--f-mono);box-shadow:0 0 0 1.5px var(--panel),0 1px 3px rgba(0,0,0,.35);transform:rotate(0)}
.st-mini{width:15px;height:15px;font-size:9px}
.st-icon{background:none;border:0}

.hy{gap:12px}
.hy-time{position:sticky;top:-14px;z-index:2;background:var(--panel);margin:-14px -14px 0;padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.hy-tl{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.hy-slider{display:flex;gap:8px;align-items:center}
.hy-slider input{flex:1;accent-color:var(--accent)}
.hy-tl2{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);padding-left:42px}
.hy-card{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.hy-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hy-h h3{margin:0}
.hy-big{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.hy-big small{font-size:14px;color:var(--ink-3);font-weight:600}
.hy-big.sm{font-size:24px}
.hy-sub{font-size:12px;color:var(--ink-2)}
.hy-toggle{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;font-weight:600;cursor:pointer;padding:8px 10px;border-radius:6px;background:var(--accent-soft)}
.hy-toggle input{accent-color:var(--accent);margin-top:2px}
.hy-toggle .hint{display:block;font-weight:400;color:var(--ink-2);font-size:11.5px}
.hy-proj .scen-seg button{font-family:var(--f-body)}
.hy-proj{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.hy-ptxt{margin:0;font-size:12.5px}
.hy-prow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;flex-wrap:wrap}
.hy-prow input{width:70px;height:26px;flex:none}
.hy-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.hy-kpis div{font-size:12px;color:var(--ink-2);display:flex;flex-direction:column}
.hy-kpis b{font-family:var(--f-display);font-size:20px;color:var(--ink);line-height:1.05;font-variant-numeric:tabular-nums}
.hy-kpis span{font-size:11px;color:var(--ink-3)}
.hy .note{margin:0}
.ch-wrap{position:relative}
.ch-read{font-size:11.5px;color:var(--ink-3);min-height:16px;font-variant-numeric:tabular-nums}
svg.ch{display:block;touch-action:none}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-ax{font:10px var(--f-body);fill:var(--ink-3)}
.ch-line{stroke:var(--ink-2);stroke-width:1.6}
.ch-line.main{stroke:var(--c1);stroke-width:2}
.ch-line.proj{stroke:var(--c1);stroke-width:2;stroke-dasharray:4 3}
.ch-line.out{stroke:var(--o3);stroke-width:1.5;stroke-dasharray:3 3}
.ch-band{fill:var(--c1);opacity:.15}
.ch-bar{fill:var(--c1)}
.ch-thr{stroke-width:1;stroke-dasharray:2 3}
.ch-thr.u1{stroke:var(--o1)} .ch-thr.u2{stroke:var(--o3)} .ch-thr.u3{stroke:var(--o4)}
.ch-thrl{font:600 9.5px var(--f-body)}
.ch-thrl.u1{fill:var(--o2)} .ch-thrl.u2{fill:var(--o3)} .ch-thrl.u3{fill:var(--o4)}
.ch-now{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:1 2}
.ch-cursor{stroke:var(--ink);stroke-width:1}
.ch-empty{font-size:12px;color:var(--ink-3);padding:10px 0}
.umb{display:flex;flex-direction:column;gap:8px}
.umb-row{border-left:3px solid var(--line-2);padding:2px 0 2px 10px;display:flex;flex-direction:column;gap:4px}
.umb-u1{border-left-color:var(--o1)} .umb-u2{border-left-color:var(--o3)} .umb-u3{border-left-color:var(--o4)}
.umb-a{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.umb-n{font-family:var(--f-display);font-weight:700;font-size:15px}
.umb-c{font-size:12px;color:var(--ink-2);display:flex;gap:4px;align-items:center}
.umb-c input{width:64px;height:24px;flex:none;padding:0 4px}

function pipRing(lat,lon,ring){ let ins=false; for(let i=0,j=ring.length-1;i<ring.length;j=i++){ const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1]; if(((yi>lat)!==(yj>lat)) && (lon < (xj-xi)*(lat-yi)/(yj-yi)+xi)) ins=!ins; } return ins; }
function pipPoly(lat,lon,poly){ if(!pipRing(lat,lon,poly[0])) return false; for(let k=1;k<poly.length;k++) if(pipRing(lat,lon,poly[k])) return false; return true; }
function pipGeom(lat,lon,g){ if(!g) return false; if(g.type==="Polygon") return pipPoly(lat,lon,g.coordinates); if(g.type==="MultiPolygon") return g.coordinates.some(p=>pipPoly(lat,lon,p)); return false; }
const KX = 111320*Math.cos(25.3*Math.PI/180), KY = 110570;
function segDist(px,py,ax,ay,bx,by){ const dx=bx-ax, dy=by-ay; const l=dx*dx+dy*dy; let t=l?((px-ax)*dx+(py-ay)*dy)/l:0; t=Math.max(0,Math.min(1,t)); const x=ax+t*dx-px, y=ay+t*dy-py; return Math.sqrt(x*x+y*y); }
function distToLines(lat,lon,lines){ const px=lon*KX, py=lat*KY; let m=Infinity; for(const ln of lines) for(let i=1;i<ln.length;i++){ const d=segDist(px,py,ln[i-1][0]*KX,ln[i-1][1]*KY,ln[i][0]*KX,ln[i][1]*KY); if(d<m) m=d; } return m; }
function linesOf(g){ if(!g) return []; if(g.type==="Polygon") return g.coordinates; if(g.type==="MultiPolygon") return g.coordinates.flat(); if(g.type==="LineString") return [g.coordinates]; if(g.type==="MultiLineString") return g.coordinates; return []; }
const LAKE_G = BASEMAP.embalseYguazu.features[0].geometry;
const LAKE_LINES = linesOf(LAKE_G);
const CAUCE_G = BASEMAP.cauceAcaray.features[0].geometry;
const ACARAY_LINES = linesOf(CAUCE_G);
function districtAt(lat,lon){ for(const f of BASEMAP.distritos.features) if(pipGeom(lat,lon,f.geometry)) return {distrito:f.properties.nombre, departamento:f.properties.depto}; return null; }
function waterContext(lat,lon){
  const inLake = pipGeom(lat,lon,LAKE_G);
  const dY = inLake?0:distToLines(lat,lon,LAKE_LINES);
  const inCauce = pipGeom(lat,lon,CAUCE_G);
  const dA = inCauce?0:distToLines(lat,lon,ACARAY_LINES);
  return dY <= dA ? {embalse:"Yguazú", dist:Math.round(dY), inLake} : {embalse:"Acaray", dist:Math.round(dA), inLake:inCauce};
}

/* UTM (WGS84) → geográficas, hemisferio sur */
function utmToLatLon(E,N,zone=21){
  const a=6378137,f=1/298.257223563,k0=0.9996,e2=f*(2-f),ep2=e2/(1-e2);
  const x=E-500000, y=N-10000000, lon0=(zone*6-183)*Math.PI/180;
  const M=y/k0, mu=M/(a*(1-e2/4-3*e2*e2/64-5*e2**3/256));
  const e1=(1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2));
  const p1=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1*e1/16-55*e1**4/32)*Math.sin(4*mu)+(151*e1**3/96)*Math.sin(6*mu)+(1097*e1**4/512)*Math.sin(8*mu);
  const N1=a/Math.sqrt(1-e2*Math.sin(p1)**2), T1=Math.tan(p1)**2, C1=ep2*Math.cos(p1)**2, R1=a*(1-e2)/(1-e2*Math.sin(p1)**2)**1.5, D=x/(N1*k0);
  const lat=p1-(N1*Math.tan(p1)/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*ep2)*D**4/24+(61+90*T1+298*C1+45*T1*T1-252*ep2-3*C1*C1)*D**6/720);
  const lon=lon0+(D-(1+2*T1+C1)*D**3/6+(5-2*C1+28*T1-3*C1*C1+8*ep2+24*T1*T1)*D**5/120)/Math.cos(p1);
  return [lat*180/Math.PI, lon*180/Math.PI];
}

const IVH_W = {
  dependencia_embalse:{label:"Dependencia económica del embalse",max:30,map:{"Alta":30,"Media":18,"Baja":6,"Ninguna":0}},
  fuente_agua_consumo:{label:"Fuente de agua para consumo",max:20,map:{"Toma directa del embalse":20,"Pozo somero propio":15,"Aljibe o agua de lluvia":10,"Compra de agua":8,"Pozo profundo comunitario":4,"Pozo profundo particular":4,"Aguatería comunitaria":2,"Junta de Saneamiento":0}},
  tenencia:{label:"Seguridad de la tenencia",max:15,map:{"Ocupación sin documento":15,"Propiedad comunitaria indígena":12,"Préstamo o cuidado":10,"Derecho de ocupación (INDERT)":8,"Arrendamiento":8,"Por verificar":8,"Título de propiedad":0}},
  franja_dominio:{label:"Relación con la franja de dominio",max:15,map:{"Dentro":15,"Colindante":8,"Por verificar":6,"Fuera":0}}
};
function ivh(r){
  const parts=[]; let s=0, known=0;
  for(const [k,w] of Object.entries(IVH_W)){
    const v=r[k]; const p = (v in w.map) ? w.map[v] : null;
    if(p!==null) known++;
    parts.push({label:w.label, value:isEmpty(v)?"Sin dato":v, pts:p??0, max:w.max}); s+=p??0;
  }
  const n=+r.integrantes, dep=(+r.menores_14||0)+(+r.mayores_65||0);
  const comp = n>0 ? Math.round(Math.min(1,dep/n)*10) : 0;
  parts.push({label:"Menores de 14 y mayores de 65 en el hogar", value:n>0?`${dep} de ${n}`:"No aplica", pts:comp, max:10}); s+=comp;
  const jf = r.sexo_jefatura==="Mujer"?5:0; parts.push({label:"Jefatura femenina", value:r.sexo_jefatura||"No aplica", pts:jf, max:5}); s+=jf;
  const cd = r.conoce_descenso==="No"?5:0; parts.push({label:"No conoce el descenso programado", value:r.conoce_descenso||"Sin dato", pts:cd, max:5}); s+=cd;
  if(known<2) return {score:null, nivel:"Sin dato", parts};
  return {score:s, nivel: s>=55?"Alta":s>=35?"Media":"Baja", parts};
}

function mergeSites(){
  const have=byCode(); let n=0;
  for(const o of SITES){ if(have.has(o.codigo.toUpperCase())) continue; state.records.push(fromSite(o)); n++; }
  if(n) state.history.push({at:nowISO(), codigo:"*", campo:"Sitios de interés incorporados", campoKey:"", antes:"", despues:`${n} sitios visitados`, editor:"Sistema", origen:"Sitios de interés del Embalse Yguazú (KMZ)"});

  for(const o of SURVEYS){ if(have.has(o.codigo.toUpperCase())) continue; state.records.push(fromSite(o)); m++; }

}

  tipo:{label:"Tipo de unidad", get:r=>TIPO_G(r.tipo_unidad), classes:[["Hogares","--c1"],["Unidades productivas","--c2"],["Uso colectivo","--c3"],["Sin dato","--cgray"]], note:"Uso colectivo agrupa comunidades indígenas, balnearios, instituciones y embarcaderos."},
  estado:{label:"Estado de la ficha", get:r=>r.estado_ficha||"Sin dato", classes:[["Relevada","--c1"],["Validada","--c3"],["Requiere revisita","--c2"],["Actualizada en gabinete","--cgray"],["Visitada por el equipo","--o3"],["Sin dato","--cgray"]]}
};
let PALETTE = {};
function readPalette(){ PALETTE={}; for(const v of ["--o1","--o2","--o3","--o4","--c1","--c2","--c3","--cgray","--mark-ring","--accent","--water","--water-line","--boundary","--land","--road","--ink","--scen","--water-lvl"]) PALETTE[v]=cssVar(v); }
function colorOf(r){ const cb=COLOR_BY[state.colorBy]; const v=cb.get(r); const c=cb.classes.find(x=>x[0]===v); return PALETTE[c?c[1]:"--cgray"]; }

/* ============================================================
   FILTROS
   ============================================================ */
function matches(r, skipStat){
  const f=state.filters;
  if(f.embalse && r.embalse!==f.embalse) return false;
  if(f.distrito && r.distrito!==f.distrito) return false;
  if(f.tipo && r.tipo_unidad!==f.tipo) return false;
  if(f.estado && r.estado_ficha!==f.estado) return false;
  if(f.franja && r.franja_dominio!==f.franja) return false;
  if(f.origen && origenDe(r)!==f.origen) return false;
  if(f.ivh && ivh(r).nivel!==f.ivh) return false;
  if(f.alerta){ const set=hy.alertSets[f.alerta]||umbralMembers(hy.umbrales.find(u=>u.id===f.alerta)); if(!set.has(r.codigo)) return false; }
  if(!skipStat && f.stat){
    if(f.stat==="alta" && ivh(r).nivel!=="Alta") return false;
    if(f.stat==="dentro" && r.franja_dominio!=="Dentro") return false;
    if(f.stat==="revisita" && r.estado_ficha!=="Requiere revisita") return false;
    if(f.stat==="alertas" && !alertsOf(r).length) return false;
    if(f.stat==="expuestas"){ const a=activeScen(); const e=a&&expo(a,r); if(!e || !(e.in || e.d<=scen.margin)) return false; }
  }
  if(f.q && /^[a-z]{2}-[a-z]{2}-?\d*/i.test(f.q.trim())){ if(!String(r.codigo).toUpperCase().startsWith(f.q.trim().toUpperCase())) return false; }
  else if(f.q){ const q=norm(f.q); const hay=norm([r.codigo,r.nombre_sitio,r.categoria_sitio,r.localidad,r.distrito,r.departamento,r.nombre_referente,r.observaciones].join(" ")); if(!q.split("_").every(t=>hay.includes(t))) return false; }
  return true;
}
function alertsOf(r){
  const a=[];
  if(!hasCoords(r)) a.push("Sin coordenadas");
  else if(!inArea(+r.latitud,+r.longitud)) a.push("Coordenadas fuera del área del censo");
  return a;
}
const visible = () => state.records.filter(r=>matches(r));

let map, canvasR, markerLayer, selRing, baseLayers={}, overlay={}, tileLayer=null, labelMarkers=[], moveMarker=null;
const markers = new Map();
function initMap(){
  map = L.map("map",{zoomControl:false, preferCanvas:true, minZoom:8, maxZoom:18, attributionControl:true, maxBounds:[[-26.4,-56.9],[-24.2,-53.9]]});
  L.control.zoom({position:"topright"}).addTo(map);
  L.control.scale({position:"bottomright", imperial:false, maxWidth:110}).addTo(map);
  map.attributionControl.setPrefix(false);
  for(const [n,z] of [["land",210],["water",320],["roads",330],["scen",345],["ref",380],["labels",460],["stations",470],["sel",640]]){ const p=map.createPane(n); p.style.zIndex=z; if(n==="labels"||n==="land"||n==="scen") p.style.pointerEvents="none"; }
  canvasR = L.canvas({padding:.3});
  buildBase();
  markerLayer = L.layerGroup().addTo(map);
  selRing = L.circleMarker([0,0],{pane:"sel",radius:12,weight:3,fill:false,interactive:false,opacity:0}).addTo(map);
  map.on("mousemove", e=>{ $("#coords").hidden=false; $("#coords").textContent = `${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`; });
  map.on("click", onMapClick);
  map.on("zoomend", updateLabels);
  map.attributionControl.addAttribution("Límites: geoBoundaries (CC BY 4.0) · Embalse, ríos y rutas: Natural Earth");
}
function buildBase(){
  const P = PALETTE;
  overlay.dist = L.geoJSON(BASEMAP.distritos,{pane:"land",interactive:false,style:()=>({color:P["--boundary"],weight:1,fillColor:P["--land"],fillOpacity:1,dashArray:null})}).addTo(map);
  overlay.water = L.layerGroup([
    overlay.lakeL=L.geoJSON(BASEMAP.embalseYguazu,{pane:"water",interactive:false,style:()=>({color:P["--water-line"],weight:1,fillColor:P["--water"],fillOpacity:1})}),
    overlay.cauceL=L.geoJSON(BASEMAP.cauceAcaray,{pane:"water",interactive:false,style:()=>({color:P["--water-line"],weight:.8,fillColor:P["--water"],fillOpacity:1})}),
    L.geoJSON(BASEMAP.rios,{pane:"water",interactive:false,style:f=>({color:P["--water-line"],weight:f.properties.nombre==="Río Paraná"?3:2,opacity:.9})})
  ]).addTo(map);
  overlay.roads = L.geoJSON(BASEMAP.rutas,{pane:"roads",interactive:false,style:f=>({color:P["--road"],weight:f.properties.jerarquia==="principal"?2.2:1.2,opacity:.9})}).addTo(map);
  overlay.dams = L.layerGroup(BASEMAP.presas.map(d=>L.marker([d.lat,d.lon],{pane:"labels",interactive:true,keyboard:false,icon:L.divIcon({className:"dam",iconSize:[16,16],html:`<svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 2 14 13H2Z" fill="${P["--ink"]}" stroke="${P["--land"]}" stroke-width="1.5"/></svg>`})}).bindTooltip(`<b>${esc(d.nombre)}</b><br>${esc(d.nota)}`,{direction:"top",offset:[0,-6]}))).addTo(map);
  overlay.labels = L.layerGroup();
  labelMarkers = BASEMAP.distritos.features.map(f=>L.marker(f.properties.lp,{pane:"labels",interactive:false,keyboard:false,icon:L.divIcon({className:"",iconSize:[0,0],html:`<div class="dlabel">${esc(f.properties.nombre)}</div>`})}));
  labelMarkers.forEach(m=>overlay.labels.addLayer(m));
  overlay.labels.addLayer(L.marker([-25.2844,-55.1964],{pane:"labels",interactive:false,keyboard:false,icon:L.divIcon({className:"",iconSize:[0,0],html:'<div class="wlabel">Embalse Yguazú</div>'})}));
  overlay.labels.addTo(map);
}
function restyleBase(){
  readPalette();
  const sat = state.base==="sat" || state.base==="osm";
  overlay.dist.setStyle({color: sat?"#ffffff":PALETTE["--boundary"], weight: sat?1.2:1, fillColor:PALETTE["--land"], fillOpacity: sat?0:1, opacity: sat?.7:1});
  overlay.water.eachLayer(l=>l.setStyle && l.setStyle(f=> f && f.geometry && f.geometry.type.includes("Polygon") ? {color:PALETTE["--water-line"],fillColor:PALETTE["--water"],fillOpacity: sat?0:1, opacity: sat?0:1} : {color:PALETTE["--water-line"], opacity: sat?0:.9}));
  overlay.roads.setStyle({color:PALETTE["--road"]});
  $("#map").classList.toggle("map-sat", sat);
  renderMarkers(); if(typeof drawScen==="function" && scen.list.length) drawScen();
}
function updateLabels(){ const z=map.getZoom(); $("#map").classList.toggle("z-hi", z>=10); const show=$("#lyLabels").checked && z>=9; if(show && !map.hasLayer(overlay.labels)) map.addLayer(overlay.labels); if(!show && map.hasLayer(overlay.labels)) map.removeLayer(overlay.labels); if(show) requestAnimationFrame(declutter); const r=z>=12?8:z>=10?6.5:5; markerLayer.eachLayer(m=>m.setRadius(r)); state.radius=r; }
function declutter(){
  const placed=[]; const els=[...document.querySelectorAll(".wlabel"), ...document.querySelectorAll(".dlabel")];
  for(const el of els){ el.style.visibility="visible"; const b=el.getBoundingClientRect(); const hit=placed.some(p=>!(b.right+6<p.left||b.left-6>p.right||b.bottom+2<p.top||b.top-2>p.bottom)); if(hit) el.style.visibility="hidden"; else placed.push(b); }
}
function setBase(v){
  state.base=v;
  if(tileLayer){ map.removeLayer(tileLayer); tileLayer=null; }
  if(v!=="carto"){
    const url = v==="sat" ? "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}" : "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
    const attr = v==="sat" ? "Imagen: Esri, Maxar, Earthstar Geographics" : "© colaboradores de OpenStreetMap";
    let errs=0;
    tileLayer = L.tileLayer(url,{maxZoom:18, attribution:attr}).addTo(map);
    tileLayer.on("tileerror",()=>{ errs++; if(errs===3){ toast("Este visor no puede cargar mapas de internet aquí. Abrí el archivo HTML descargado en tu navegador para ver la imagen satelital."); document.querySelector('input[name=base][value=carto]').checked=true; setBase("carto"); } });
  }
  restyleBase();
}
function renderMarkers(){
  markerLayer.clearLayers(); markers.clear();
  const r=state.radius||5;
  for(const rec of visible()){
    if(!hasCoords(rec)) continue;
    const sit=esSitio(rec); const m=L.circleMarker([+rec.latitud,+rec.longitud],{renderer:canvasR,radius:sit?r+0.5:r,weight:sit?2.4:1.5,color:sit?PALETTE["--ink"]:PALETTE["--mark-ring"],fillColor:colorOf(rec),fillOpacity:1});
    m.bindTooltip(`<span class="mono">${esc(rec.codigo)}</span> · ${esc(rec.tipo_unidad||"")}<br>${esc(rec.localidad||"")}${rec.distrito?" · "+esc(rec.distrito):""}`,{direction:"top",offset:[0,-4]});
    m.on("click",ev=>{ L.DomEvent.stopPropagation(ev); if(state.mode==="placing") return; select(rec.codigo,false); });
    markerLayer.addLayer(m); markers.set(rec.codigo,m);
  }
  updateSelRing();
}
function updateSelRing(){
  const r = state.selected && state.records.find(x=>x.codigo===state.selected);
  if(r && hasCoords(r)){ selRing.setLatLng([+r.latitud,+r.longitud]); selRing.setStyle({opacity:1,color:PALETTE["--ink"]}); }
  else selRing.setStyle({opacity:0});
}
function fitAll(){ const pts=state.records.filter(hasCoords).map(r=>[+r.latitud,+r.longitud]); if(pts.length) map.fitBounds(pts,{padding:[40,40],maxZoom:13}); else map.setView([-25.3,-55.1],10); }

function renderStats(){
  const base = state.records.filter(r=>matches(r,true));
  const n=base.length, tot=state.records.length;
  const alta=base.filter(r=>ivh(r).nivel==="Alta").length;
  const dentro=base.filter(r=>r.franja_dominio==="Dentro").length;
  const rev=base.filter(r=>r.estado_ficha==="Requiere revisita").length;
  const al=base.filter(r=>alertsOf(r).length).length;
  const s=state.filters.stat;
  const cell=(k,num,lab,extra="")=>`<button class="stat" data-stat="${k}" aria-pressed="${s===k}"><div class="n">${num}${extra}</div><div class="l">${lab}</div></button>`;
  $("#stats").innerHTML = cell("", n, n===tot?"fichas en total":"fichas con estos filtros", n!==tot?` <small>/ ${tot}</small>`:"")
    + cell("alta", alta, "IVH alto")
    + (activeScen() ? cell("expuestas", base.filter(r=>{ const e=expo(activeScen(),r); return e&&(e.in||e.d<=scen.margin); }).length, `expuestas en ${esc(scenName(activeScen()))}`) : cell("dentro", dentro, "dentro de la franja"))
    + (al ? cell("alertas", al, "con alertas de ubicación") : cell("revisita", rev, "requieren revisita"));
}
function renderList(){

      <span class="t2">${r.nombre_sitio?`<b>${esc(r.nombre_sitio)}</b> · `:""}${esc(r.tipo_unidad||"Sin tipo")}${r.localidad?" · "+esc(r.localidad):""}${r.distrito?", "+esc(r.distrito):""}</span>
    </button>`;

}
function renderLegend(){

function renderSummary(){

      <p class="note">Calculado sobre las ${rows.length} fichas que cumplen los filtros actuales.</p></div>

function fmtVal(f, v){
  if(isEmpty(v)) return '<span class="empty-v">Sin dato</span>';
  if(f && f.sensitive && !state.showSensitive) return '<span class="masked">••••••••</span>';
  if(f && f.type==="date") return esc(fmtD(v));
  if(f && f.type==="coord") return `<span class="mono">${(+v).toFixed(6)}</span>`;
  if(f && f.type==="multi") return splitMulti(v).map(x=>`<span class="pill" style="margin:0 4px 4px 0">${esc(x)}</span>`).join("");
  if(f && f.key==="preocupacion_descenso") return `${esc(v)} de 5`;
  if(f && f.key==="distancia_costa_m") return `${esc(v)} m`;
  return esc(v);
}
function select(code, fly=true){
  state.selected=code; state.editing=null; state.station=null; state.dtab="ficha";
  const r=state.records.find(x=>x.codigo===code);
  if(r && hasCoords(r) && fly){ flyOffset([+r.latitud,+r.longitud], Math.max(map.getZoom(),13)); }
  document.querySelectorAll(".item").forEach(e=>e.setAttribute("aria-current", e.dataset.code===code));
  if(window.innerWidth<=900) $("#side").classList.remove("open");
  updateSelRing(); renderDrawer();
}

function closeDrawer(){ state.selected=null; state.editing=null; state.station=null; cancelMove(); updateSelRing(); renderDrawer(); document.querySelectorAll(".item").forEach(e=>e.setAttribute("aria-current","false")); }

function fichaHtml(r){
  let html=scenFichaHtml(r);

    const fs=SCHEMA.filter(f=>f.group===g && f.key!=="codigo");
    html+=`<div class="grp"><h4>${esc(gl)}</h4><dl class="kv">${fs.map(f=>`<dt>${esc(f.label)}</dt><dd>${fmtVal(f,r[f.key])}</dd>`).join("")}</dl></div>`;
  }
  const ex=Object.entries(r._extra||{}).filter(([k,v])=>!isEmpty(v));
  if(ex.length) html+=`<div class="grp"><h4>Información adicional</h4><dl class="kv">${ex.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></div>`;
  html+=`<div class="grp"><h4>Registro</h4><dl class="kv"><dt>Origen</dt><dd>${esc(r._origen||"—")}</dd><dt>Última modificación</dt><dd>${r._actualizado?esc(fmtDT(r._actualizado)):"Sin cambios desde la carga"}</dd></dl></div>`;
  return html;
}
function ivhHtml(r,v){
  if(v.score===null) return `<div class="grp"><p>Faltan datos para calcular el índice en esta ficha. Se necesitan al menos dos de: dependencia del embalse, fuente de agua, tenencia y franja de dominio.</p></div>`;

      <div class="gauge"><div class="g"><i style="left:${v.score}%"></i></div><div class="ticks"><span style="left:0">0</span><span style="left:35%">35</span><span style="left:55%">55</span><span style="left:100%">100</span></div></div></div>
    <table class="parts">${v.parts.map(p=>`<tr><td>${esc(p.label)}</td><td class="v">${esc(p.value)}</td><td>${p.pts} / ${p.max}</td></tr>`).join("")}</table>
    <div class="callout">Índice ilustrativo para el prototipo. Los factores y pesos se calibran con el equipo social antes de usarlo en decisiones.</div></div>`;
}
function histHtml(h){
  if(!h.length) return `<div class="grp"><p style="color:var(--ink-3)">Esta ficha no tiene cambios registrados desde que se cargó.</p></div>`;
  return `<div class="hist">${h.slice().reverse().map(x=>`<div class="hrow"><div class="h1"><span>${esc(fmtDT(x.at))}</span><span>${esc(x.editor||"")}</span></div>
    <div class="h2"><b>${esc(x.campo)}</b>${x.antes!==""||x.despues!==""?`: ${x.antes!==""?`<del>${esc(maskIf(x.campoKey,x.antes))}</del> → `:""}<ins>${esc(maskIf(x.campoKey,x.despues))}</ins>`:""}</div>

const maskIf = (k,v) => (BYKEY[k]&&BYKEY[k].sensitive&&!state.showSensitive&&!isEmpty(v))?"••••••":v;

/* ---------- edición ---------- */
function startEdit(code, draft){
  cancelMove(); removeDraftPin();
  state.editing = code || "__new__";
  state.draft = draft || JSON.parse(JSON.stringify(state.records.find(x=>x.codigo===code)));
  renderDrawer();
}
function fieldInput(f, v){
  const id="e_"+f.key;
  if(f.type==="select") return `<select id="${id}">${optionsHtml(f.options.includes(v)||isEmpty(v)?f.options:[v,...f.options],v,"Sin dato")}</select>`;
  if(f.type==="scale") return `<div class="seg" role="radiogroup" aria-label="${esc(f.label)}">${f.options.map(o=>`<label><input type="radio" name="${id}" value="${o}"${String(v)===o?" checked":""}>${o}</label>`).join("")}</div>`;
  if(f.type==="multi"){ const cur=new Set(splitMulti(v)); return `<div class="checks" id="${id}">${f.options.map(o=>`<label><input type="checkbox" value="${esc(o)}"${cur.has(o)?" checked":""}>${esc(o)}</label>`).join("")}</div>`; }
  if(f.type==="textarea") return `<textarea id="${id}">${esc(v)}</textarea>`;
  if(f.type==="date") return `<input id="${id}" type="date" value="${esc(String(v).slice(0,10))}">`;
  if(f.type==="number") return `<input id="${id}" type="number" inputmode="decimal" step="any" value="${esc(v)}">`;
  if(f.type==="coord") return `<input id="${id}" type="text" class="mono" inputmode="decimal" value="${esc(v)}">`;
  return `<input id="${id}" type="text" value="${esc(v)}" autocomplete="off">`;
}
function editHtml(){
  const r=state.draft; const isNew=state.editing==="__new__";
  let html=`<div class="dhead"><div class="r1"><div><div class="code">${isNew?"Nueva ficha":esc(r.codigo)}</div><div class="where">${isNew?"Completá los datos relevados. Los campos de ubicación se calcularon desde el punto marcado.":"Editando ficha"}</div></div>
    <button class="btn ghost iconbtn close" id="eClose" aria-label="Cancelar edición">${ICON.x}</button></div><div style="height:12px"></div></div><div class="dbody"><form class="form" id="eForm" novalidate>`;
  if(!state.editor) html+=`<div class="editor-box"><label for="e__editor">¿Quién registra este cambio?</label><input id="e__editor" type="text" placeholder="Nombre y apellido" autocomplete="name"><span style="font-size:12px;color:var(--ink-2)">Queda en el historial de cada cambio. Se pide una sola vez en este navegador.</span></div>`;
  for(const [g,gl] of GROUPS){
    html+=`<div class="grp"><h4>${esc(gl)}</h4>`;
    for(const f of SCHEMA.filter(x=>x.group===g)){
      if(f.key==="codigo"){ html+=`<div class="fld"><label for="e_codigo">${esc(f.label)}</label>${isNew?`<input id="e_codigo" type="text" class="mono" value="${esc(r.codigo)}">`:`<input id="e_codigo" type="text" class="mono" value="${esc(r.codigo)}" disabled>`}${isNew?'<span class="hint">Propuesto automáticamente; podés reemplazarlo por el código de la encuestadora.</span>':''}</div>`; continue; }
      if(f.key==="latitud"){ html+=`<div class="fld two"><div class="fld" style="margin:0"><label for="e_latitud">Latitud</label>${fieldInput(f,r.latitud)}</div><div class="fld" style="margin:0"><label for="e_longitud">Longitud</label>${fieldInput(BYKEY.longitud,r.longitud)}</div></div>`; continue; }
      if(f.key==="longitud") continue;
      const lbl = (f.type==="multi"||f.type==="scale") ? `<span class="lb">${esc(f.label)}</span>` : `<label for="e_${f.key}">${esc(f.label)}</label>`;
      html+=`<div class="fld">${lbl}${fieldInput(f,r[f.key])}${f.sensitive?'<span class="hint">Dato personal: se oculta por defecto y puede excluirse al exportar.</span>':''}${f.key==="distancia_costa_m"&&isNew?'<span class="hint">Estimada sobre la cartografía base; corregir con el dato de campo.</span>':''}</div>`;
    }
    html+=`</div>`;
  }
  html+=`<div class="formbar"><span class="who">${state.editor?`Registrado como <b>${esc(state.editor)}</b> · <button type="button" class="linkbtn" id="eWho">cambiar</button>`:""}</span><button type="button" class="btn" id="eCancel">Cancelar</button><button type="submit" class="btn primary">${isNew?"Crear ficha":"Guardar cambios"}</button></div></form></div>`;
  return html;
}
let draftPin=null;
function removeDraftPin(){ if(draftPin){ map.removeLayer(draftPin); draftPin=null; } }
function placeDraftPin(){
  removeDraftPin(); const r=state.draft; if(state.editing!=="__new__" || r.latitud==="" ) return;
  draftPin=L.marker([+r.latitud,+r.longitud],{draggable:true,pane:"sel",icon:L.divIcon({className:"",iconSize:[22,22],iconAnchor:[11,22],html:'<div class="pinicon"></div>'})}).addTo(map).bindTooltip("Arrastrá para ajustar la ubicación",{direction:"top",offset:[0,-22]});
  draftPin.on("dragend",()=>{ const p=draftPin.getLatLng(); const lat=+p.lat.toFixed(6), lon=+p.lng.toFixed(6); $("#e_latitud").value=lat; $("#e_longitud").value=lon; const d=districtAt(lat,lon); if(d){ $("#e_distrito").value=d.distrito; $("#e_departamento").value=d.departamento; } const w=waterContext(lat,lon); $("#e_distancia_costa_m").value=w.inLake?0:w.dist; });
}
function bindEdit(){
  placeDraftPin();
  const cancel=()=>{ removeDraftPin(); const wasNew=state.editing==="__new__"; state.editing=null; state.draft=null; if(wasNew) state.selected=null; renderDrawer(); };
  $("#eClose").onclick=cancel; $("#eCancel").onclick=cancel;
  if($("#eWho")) $("#eWho").onclick=()=>{ state.editor=""; collectDraft(); renderDrawer(); };
  $("#eForm").onsubmit=e=>{ e.preventDefault(); commitEdit(); };
}
function collectDraft(){
  const r=state.draft;
  for(const f of SCHEMA){
    const el=$("#e_"+f.key);
    if(f.type==="scale"){ const c=document.querySelector(`input[name="e_${f.key}"]:checked`); r[f.key]=c?c.value:""; continue; }
    if(!el) continue;
    if(f.type==="multi"){ r[f.key]=[...el.querySelectorAll("input:checked")].map(i=>i.value).join("; "); continue; }
    if(el.disabled) continue;
    let v=el.value.trim();
    if(f.type==="number"||f.type==="coord") v=parseNum(v);
    r[f.key]=v;
  }
}
function commitEdit(){
  const edEl=$("#e__editor");
  if(edEl){ const n=edEl.value.trim(); if(!n){ edEl.focus(); toast("Escribí tu nombre para registrar el cambio en el historial."); return; } state.editor=n; }
  collectDraft();
  const r=state.draft; const isNew=state.editing==="__new__";
  r.codigo=String(r.codigo||"").trim();
  if(!r.codigo){ toast("La ficha necesita un código."); $("#e_codigo").focus(); return; }
  if(isNew && byCode().has(r.codigo.toUpperCase())){ toast(`Ya existe una ficha con el código ${r.codigo}.`); $("#e_codigo").focus(); return; }
  if((r.latitud===""||r.longitud==="") && !(r.latitud===""&&r.longitud==="")){ toast("Completá latitud y longitud, o dejá ambas vacías."); return; }
  const at=nowISO();
  if(isNew){
    r._creado=at; r._actualizado=at; r._origen="Alta en gabinete"; if(!r.estado_ficha) r.estado_ficha="Actualizada en gabinete";
    state.records.push(r);
    state.history.push({at, codigo:r.codigo, campo:"Ficha creada", campoKey:"", antes:"", despues:`${r.tipo_unidad||"Ficha"} en ${r.localidad||r.distrito||"ubicación marcada"}`, editor:state.editor, origen:"Alta manual"});
    toast(`Ficha ${r.codigo} creada.`);
  } else {
    const orig=state.records.find(x=>x.codigo===state.editing);
    let n=0;
    for(const f of SCHEMA){ const a=orig[f.key], b=r[f.key]; if(String(a??"")!==String(b??"")){ state.history.push({at,codigo:orig.codigo,campo:f.label,campoKey:f.key,antes:String(a??""),despues:String(b??""),editor:state.editor,origen:"Edición manual"}); orig[f.key]=b; n++; } }
    if(n) orig._actualizado=at;
    toast(n?`Se guardaron ${n} cambio${n>1?"s":""} en ${orig.codigo}.`:"No había cambios para guardar.");
  }
  removeDraftPin(); state.selected=r.codigo; state.editing=null; state.draft=null; state.dtab="ficha";
  save(); renderFilters(); renderData(); renderSource(); renderDrawer();
}

/* ---------- alta y reubicación en el mapa ---------- */
function setMode(m){ state.mode=m; $("#app").classList.toggle("placing", m==="placing"); const b=$("#placeBanner"); if(b) b.remove();
  if(m==="placing"){ const div=document.createElement("div"); div.className="mcard placing-banner"; div.id="placeBanner"; div.innerHTML=`<span>Hacé clic en el mapa donde se ubica la nueva ficha.</span><button class="btn small" id="placeCancel">Cancelar</button>`; $("#mapwrap").appendChild(div); $("#placeCancel").onclick=()=>setMode("view"); } }
function nextCode(emb){ const pre = emb==="Yguazú"?"HS-YG-":emb==="Acaray"?"HS-AC-":"HS-NV-"; let mx=0; state.records.forEach(r=>{ const s=String(r.codigo); if(s.startsWith(pre)){ const n=parseInt(s.slice(pre.length),10); if(n>mx) mx=n; } }); return pre+String(mx+1).padStart(4,"0"); }
function onMapClick(e){
  if(state.mode!=="placing") return;
  setMode("view");
  const lat=+e.latlng.lat.toFixed(6), lon=+e.latlng.lng.toFixed(6);
  const r=blank(); r.latitud=lat; r.longitud=lon;
  const d=districtAt(lat,lon); if(d){ r.distrito=d.distrito; r.departamento=d.departamento; }
  const w=waterContext(lat,lon); r.embalse=w.embalse; r.distancia_costa_m=w.inLake?0:w.dist;
  r.fecha_relevamiento=new Date().toISOString().slice(0,10); r.estado_ficha="Actualizada en gabinete"; r.codigo=nextCode(r.embalse);
  state.selected=null; startEdit(null, r);
}
function startMove(code){
  cancelMove();
  const r=state.records.find(x=>x.codigo===code); if(!r) return;
  const ll = hasCoords(r)?[+r.latitud,+r.longitud]:map.getCenter();
  state.moving=code;
  moveMarker=L.marker(ll,{draggable:true,autoPan:true,pane:"sel",icon:L.divIcon({className:"",iconSize:[22,22],iconAnchor:[11,22],html:'<div class="pinicon"></div>'})}).addTo(map);
  map.panTo(ll);
  const div=document.createElement("div"); div.className="mcard placing-banner"; div.id="moveBanner";
  div.innerHTML=`<span>Arrastrá el marcador a la nueva ubicación.</span><button class="btn small" id="mvOk">Guardar ubicación</button><button class="btn small" id="mvCancel">Cancelar</button>`;
  $("#mapwrap").appendChild(div);
  $("#mvCancel").onclick=cancelMove;
  $("#mvOk").onclick=()=>{
    if(!state.editor){ cancelMove(); toast("Primero registrá tu nombre: abrí Editar en la ficha."); startEdit(code); return; }
    const p=moveMarker.getLatLng(); const at=nowISO();
    const lat=+p.lat.toFixed(6), lon=+p.lng.toFixed(6);
    const before = hasCoords(r)?`${(+r.latitud).toFixed(6)}, ${(+r.longitud).toFixed(6)}`:"Sin ubicación";
    r.latitud=lat; r.longitud=lon; r._actualizado=at;
    const d=districtAt(lat,lon);
    state.history.push({at,codigo:r.codigo,campo:"Ubicación",campoKey:"latitud",antes:before,despues:`${lat}, ${lon}`,editor:state.editor,origen:"Reubicación en el mapa"});
    if(d && d.distrito!==r.distrito){ state.history.push({at,codigo:r.codigo,campo:"Distrito",campoKey:"distrito",antes:r.distrito,despues:d.distrito,editor:state.editor,origen:"Reubicación en el mapa"}); r.distrito=d.distrito; r.departamento=d.departamento; }
    cancelMove(); save(); renderFilters(); renderData(); renderDrawer(); toast(`Ubicación de ${r.codigo} actualizada.`);
  };
}
function cancelMove(){ if(moveMarker){ map.removeLayer(moveMarker); moveMarker=null; } state.moving=null; const b=$("#moveBanner"); if(b) b.remove(); }

$("#dataFile").addEventListener("change",e=>{ const f=e.target.files[0]; e.target.value=""; if(f) readDataFile(f); });
async function readDataFile(file){
  try{
    const name=file.name; const ext=name.split(".").pop().toLowerCase();
    let rows=[], cols=[];
    if(ext==="geojson"||ext==="json"){
      const gj=JSON.parse(await file.text());
      const feats = gj.type==="FeatureCollection"?gj.features:Array.isArray(gj)?gj:[gj];
      rows = feats.map(f=>{ const p=Object.assign({},f.properties||{}); const g=f.geometry; if(g&&g.type==="Point"){ p.__lon=g.coordinates[0]; p.__lat=g.coordinates[1]; } return p; });
    } else {
      if(typeof XLSX==="undefined") throw new Error("No se pudo cargar el lector de Excel. Revisá la conexión e intentá de nuevo.");
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:"array",cellDates:true,raw:false});
      const sn = wb.SheetNames.find(s=>/ficha|censo|data|datos|registro/i.test(s)) || wb.SheetNames[0];
      rows = XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:"",raw:true,dateNF:"yyyy-mm-dd"});
    }
    rows = rows.filter(r=>Object.values(r).some(v=>!isEmpty(v)));
    if(!rows.length) throw new Error("El archivo no tiene filas con datos.");
    cols = [...new Set(rows.flatMap(r=>Object.keys(r)))];
    IMP = {name, rows, cols, map:autoMap(cols), fixSwap:true};
    { const codeCol=Object.keys(IMP.map).find(c=>IMP.map[c]==="codigo"); const ex=byCode(); const overlap = codeCol && rows.some(r=>ex.has(String(r[codeCol]).trim().toUpperCase())); IMP.mode = (overlap || !state.source.demo) ? "merge" : "replace"; }
    showMapping();
  }catch(err){ toast("No se pudo leer el archivo: "+(err.message||err)); }
}
function autoMap(cols){

    if(c==="__lon"){ m[c]="longitud"; used.add("longitud"); continue; }

function coerce(f, v){

function buildImport(){

    if(ex){ let ch=0; for(const f of SCHEMA){ if(!Object.values(m).includes(f.key) && !(f.key==="distrito"||f.key==="departamento"||f.key==="embalse")) continue; if(r[f.key]!=="" && String(ex[f.key]??"")!==String(r[f.key]??"")) ch++; } if(ch){ nUpd++; nFields+=ch; } else nSame++; }

   ESCENARIOS DE AGUA: crecidas por caudal y niveles de cada embalse
   ============================================================ */
const SCEN_KEY = "censo-hidrosocial-escenarios-v2";
const SCEN_RAMP = ["#0d366b","#184f95","#256abf","#3987e5","#6da7ec","#9ec5f4","#cde2fb"];
const GRUPOS = {
  crecida:{label:"Crecidas", largo:"Crecidas por caudal", unidad:"m³/s", base:null},
  yguazu:{label:"Embalse Yguazú", largo:"Nivel del embalse Yguazú", unidad:"msnm", base:"lake"},
  acaray:{label:"Embalse Acaray", largo:"Nivel del embalse Acaray", unidad:"msnm", base:"cauce"}
};
const scen = { list:[], active:null, tab:"crecida", margin:50, showAll:false, removed:[], names:{}, values:{}, groups:{} };
let scenLayer=null;
function prepScenario(s){
  const polys=[]; const g=s.geom;
  const add=rings=>{ let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity; for(const p of rings[0]){ if(p[0]<a)a=p[0]; if(p[0]>c)c=p[0]; if(p[1]<b)b=p[1]; if(p[1]>d)d=p[1]; } polys.push({rings,bbox:[a,b,c,d]}); };
  if(g.type==="Polygon") add(g.coordinates); else if(g.type==="MultiPolygon") g.coordinates.forEach(add);
  s.polys=polys;
  s.bbox=polys.reduce((m,p)=>[Math.min(m[0],p.bbox[0]),Math.min(m[1],p.bbox[1]),Math.max(m[2],p.bbox[2]),Math.max(m[3],p.bbox[3])],[Infinity,Infinity,-Infinity,-Infinity]);
  s.cache=new Map();
  if(!s.grupo) s.grupo="crecida";
  return s;
}
const scenGroup = s => scen.groups[s.id] || s.grupo || "crecida";
function scenList(grp){ return scen.list.filter(s=>!s.auto && !scen.removed.includes(s.id) && (!grp || scenGroup(s)===grp)).sort((a,b)=>(scenValue(a)??0)-(scenValue(b)??0)); }

function scenName(s){ return scen.names[s.id] || s.nombre; }
function scenValue(s){ return s.id in scen.values ? scen.values[s.id] : s.valor; }
function scenColor(s){ const L=scenList(scenGroup(s)); const i=L.indexOf(s); if(L.length<=1) return SCEN_RAMP[2]; const idx=Math.round(i*(SCEN_RAMP.length-2)/(L.length-1)); return SCEN_RAMP[Math.min(SCEN_RAMP.length-1,idx)]; }
/* Exposición de una ficha a un escenario: {in, d} (d en metros al borde; Infinity si está a más de 5 km) */
function expo(s, r){
  if(!s || !hasCoords(r)) return null;
  const lat=+r.latitud, lon=+r.longitud, key=lat+"|"+lon;
  if(s.cache.has(key)) return s.cache.get(key);
  let res; const B=s.bbox, pad=0.05;
  if(lon<B[0]-pad||lon>B[2]+pad||lat<B[1]-pad||lat>B[3]+pad) res={in:false,d:Infinity};
  else {
    let inside=false;
    for(const p of s.polys){ const b=p.bbox; if(lon<b[0]||lon>b[2]||lat<b[1]||lat>b[3]) continue; if(pipPoly(lat,lon,p.rings)){ inside=true; break; } }
    if(inside) res={in:true,d:0};
    else { let d=Infinity; for(const p of s.polys){ const b=p.bbox; if(lon<b[0]-pad||lon>b[2]+pad||lat<b[1]-pad||lat>b[3]+pad) continue; const dd=distToLines(lat,lon,p.rings); if(dd<d) d=dd; } res={in:false,d:d>5000?Infinity:Math.round(d)}; }
  }
  s.cache.set(key,res); return res;
}
function expoStatus(s, r){ const e=expo(s,r); if(!e) return "Sin ubicación"; if(e.in) return "Dentro del área"; if(e.d<=scen.margin) return `A menos de ${scen.margin} m`; return "Fuera"; }
function activeScen(){ return scen.active ? scenById(scen.active) : null; }
function firstReach(r,grp){ for(const s of scenList(grp)){ const e=expo(s,r); if(e && e.in) return s; } return null; }
function fmtDist(e){ if(!e) return "Sin ubicación"; if(e.in) return "—"; if(!isFinite(e.d)) return "más de 5 km"; return e.d>=1000?`${(e.d/1000).toFixed(1).replace(".",",")} km`:`${e.d} m`; }
const fmtKm2 = v => (+v).toLocaleString("es-PY",{maximumFractionDigits:1});
const usaEmbalse = r => ["Alta","Media"].includes(r.dependencia_embalse) || r.fuente_agua_consumo==="Toma directa del embalse" || splitMulti(r.usos_agua).some(u=>/Pesca|Abrevadero|Riego|Transporte|Turismo|Acuicultura/.test(u));

/* ---------- carga de archivos ---------- */
function dpSimplify(pts, tol){
  if(pts.length<=4) return pts;
  const keep=new Uint8Array(pts.length); keep[0]=keep[pts.length-1]=1;
  const stack=[[0,pts.length-1]]; const t2=tol*tol;
  while(stack.length){ const [a,b]=stack.pop(); let md=0, mi=-1; const ax=pts[a][0],ay=pts[a][1],bx=pts[b][0],by=pts[b][1];
    for(let i=a+1;i<b;i++){ const d=segDist(pts[i][0],pts[i][1],ax,ay,bx,by); if(d>md){ md=d; mi=i; } }
    if(md*md>t2 && mi>0){ keep[mi]=1; stack.push([a,mi],[mi,b]); } }
  return pts.filter((p,i)=>keep[i]);
}
function polysFromGeoJSON(gj){
  const out=[];
  const walk=g=>{ if(!g) return; if(g.type==="Polygon") out.push(g.coordinates); else if(g.type==="MultiPolygon") g.coordinates.forEach(c=>out.push(c)); else if(g.type==="GeometryCollection") g.geometries.forEach(walk); };
  const feats = gj.type==="FeatureCollection"?gj.features:gj.type==="Feature"?[gj]:[{geometry:gj}];
  feats.forEach(f=>walk(f.geometry));
  return out.map(rings=>rings.map(r=>dpSimplify(r.map(p=>[+(+p[0]).toFixed(5),+(+p[1]).toFixed(5)]),0.00004)).filter(r=>r.length>=4)).filter(p=>p.length);
}
function ringArea(r){ let a=0; for(let i=0,j=r.length-1;i<r.length;j=i++){ a+=(r[j][0]*KX)*(r[i][1]*KY)-(r[i][0]*KX)*(r[j][1]*KY); } return Math.abs(a/2); }
async function kmzToGeoJSON(file){
  if(typeof JSZip==="undefined") throw new Error("no se pudo cargar el lector de KMZ");
  const zip=await JSZip.loadAsync(await file.arrayBuffer());
  const k=Object.keys(zip.files).find(n=>/\.kml$/i.test(n)); if(!k) throw new Error("el KMZ no contiene un KML");
  return toGeoJSON.kml(new DOMParser().parseFromString(await zip.files[k].async("string"),"text/xml"));
}
async function fileToGeoJSON(file){
  const ext=file.name.split(".").pop().toLowerCase();
  if(ext==="kmz") return kmzToGeoJSON(file);
  if(ext==="kml"){ if(typeof toGeoJSON==="undefined") throw new Error("no se pudo cargar el lector de KML"); return toGeoJSON.kml(new DOMParser().parseFromString(await file.text(),"text/xml")); }
  return JSON.parse(await file.text());
}
async function readScenFile(file, grupo){
  const polys=polysFromGeoJSON(await fileToGeoJSON(file));
  if(!polys.length) throw new Error("el archivo no tiene polígonos");
  const base=file.name.replace(/\.[^.]+$/,"").replace(/^[0-9a-f]{6,}-/i,"");
  const m=base.match(/-?\d+(?:[.,]\d+)?/); const valor=m?parseNum(m[0]):null;
  const area=polys.reduce((t,p)=>t+ringArea(p[0])-p.slice(1).reduce((h,r)=>h+ringArea(r),0),0)/1e6;
  return prepScenario({id:"u"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), nombre:base, valor, grupo, area_km2:+area.toFixed(2), archivo:file.name, embebido:false, geom:{type:"MultiPolygon",coordinates:polys}});
}
$("#scenFile").addEventListener("change", async e=>{

function stationStatus(s,i){
  const vars=Object.keys(VARS).filter(v=>sv(s.id,v));
  let last=-1; vars.forEach(v=>{ const lv=lastValid(sv(s.id,v),i); if(lv&&lv.i>last) last=lv.i; });
  const off = last<0 || i-last>3;
  let txt;
  if(sv(s.id,"cota_msnm")) txt=`${fmtN(lastValid(sv(s.id,"cota_msnm"),i)?.v,2)} msnm`;
  else if(sv(s.id,"caudal_m3s")) txt=`${fmtN(lastValid(sv(s.id,"caudal_m3s"),i)?.v,0)} m³/s`;
  else if(sv(s.id,"lluvia_mm")) txt=`${fmtN(acum(sv(s.id,"lluvia_mm"),i,7)?.v,0)} mm 7 d`;
  else txt="—";
  if(off) txt = last<0 ? "Sin datos" : `Sin datos desde ${fmtF(last)}`;
  return {off, last, txt};
}
function setHyIdx(i, light){

function togglePlay(){

}

/* ---------- carga de datos de estaciones ---------- */
function toISO(v){
  if(v instanceof Date) return v.toISOString().slice(0,10);
  if(typeof v==="number" && v>20000 && v<80000) return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
  const s=String(v??"").trim(); let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/); if(m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  return null;
}
function stationIdFrom(v){ const c=norm(v).replace(/_/g,""); const s=STATIONS.find(s=>norm(s.id).replace(/_/g,"")===c) || STATIONS.find(s=>norm(s.codigo).replace(/_/g,"")===c) || STATIONS.find(s=>c.startsWith(norm(s.codigo).replace(/_/g,""))); return s?s.id:null; }
function ensureDate(iso){
  let k=hy.fechas.indexOf(iso); if(k>=0) return k;
  if(iso>hy.fechas[hy.fechas.length-1]){ let last=hy.fechas[hy.fechas.length-1]; while(last<iso){ last=addDays(last,1); hy.fechas.push(last); for(const key in hy.series) hy.series[key].push(null); } return hy.fechas.length-1; }
  if(iso<hy.fechas[0]){ let first=hy.fechas[0]; const add=[]; while(first>iso){ first=addDays(first,-1); add.unshift(first); } hy.fechas=add.concat(hy.fechas); for(const key in hy.series) hy.series[key]=Array(add.length).fill(null).concat(hy.series[key]); return 0; }
  return -1;
}
$("#hyFile").addEventListener("change", async e=>{
  const file=e.target.files[0]; e.target.value=""; if(!file) return;
  try{
    if(typeof XLSX==="undefined") throw new Error("no se pudo cargar el lector de Excel");
    const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:"",raw:true});
    if(!rows.length) throw new Error("el archivo no tiene filas");
    const cols=Object.keys(rows[0]); const nc=Object.fromEntries(cols.map(c=>[norm(c),c]));
    const cF=nc.fecha||nc.date||nc.dia, cS=nc.estacion||nc.codigo||nc.station||nc.estacion_codigo;
    if(!cF||!cS) throw new Error("faltan las columnas fecha y estación");
    const cV=nc.variable, cVal=nc.valor||nc.value;
    let n=0, skip=0; const sts=new Set();
    const put=(id,v,iso,val)=>{ const x=parseNum(val); if(x===""||!id||!iso){ skip++; return; } const key=id+"|"+v; if(!hy.series[key]) hy.series[key]=Array(hy.fechas.length).fill(null); const k=ensureDate(iso); if(k<0){ skip++; return; } hy.series[key][k]=x; n++; sts.add(id); };
    for(const r of rows){
      const iso=toISO(r[cF]); const id=stationIdFrom(r[cS]);
      if(cV&&cVal){ const v=VAR_ALIAS[norm(r[cV])]; if(!v){ skip++; continue; } put(id,v,iso,r[cVal]); }
      else for(const c of cols){ const v=VAR_ALIAS[norm(c)]; if(v) put(id,v,iso,r[c]); }
    }
    if(!n) throw new Error("no se reconocieron valores (revisá los códigos de estación y los nombres de las variables)");
    hy.cargas.push({archivo:file.name,n,at:nowISO()});
    hy.idx=hy.fechas.length-1; hySave(); updateStationIcons(); if(hy.auto) applyAutoLevel(false); renderHydro();
    toast(`Se cargaron ${n} valores de ${sts.size} estaciones${skip?` (${skip} filas sin reconocer)`:""}. Datos hasta ${fmtF(hy.fechas.length-1)}.`);
  }catch(err){ toast("No se pudieron cargar los datos: "+(err.message||err)); }
});
async function downloadHyTemplate(){
  if(typeof XLSX==="undefined"){ toast("El generador de Excel no se cargó."); return; }
  const wb=XLSX.utils.book_new(); const last=hy.fechas[hy.fechas.length-1]; const next=addDays(last,1);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([{fecha:next,estacion:"AY23",variable:"cota_msnm",valor:219.4},{fecha:next,estacion:"AY18",variable:"lluvia_mm",valor:12.5},{fecha:next,estacion:"AY11",variable:"caudal_m3s",valor:48.2}]), "datos");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(STATIONS.map(s=>({estacion:s.id,nombre:s.nombre,tipo:s.tipo,variables:Object.keys(VARS).filter(v=>sv(s.id,v)).join(", ")}))), "estaciones");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(Object.entries(VARS).map(([k,v])=>({variable:k,descripcion:v.label,unidad:v.unidad}))), "variables");
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  if(await saveFile("plantilla_datos_estaciones.xlsx", new Blob([buf]))) toast("Plantilla descargada.");
}

/* ============================================================
   EVENTOS
   ============================================================ */
function bindUI(){
  $("#btnImport").onclick=openImport;
  $("#btnExport").onclick=openExport;
  $("#btnHistory").onclick=openHistory;
  $("#btnAbout").onclick=openAbout;
  $("#btnNew").onclick=()=>{ closeDrawer(); setMode("placing"); if(window.innerWidth<=900) $("#side").classList.remove("open"); };
  $("#btnSide").onclick=()=>$("#side").classList.toggle("open");
  $("#q").addEventListener("input", debounce(e=>{ state.filters.q=e.target.value; state.listLimit=150; renderData(); },150));
  $("#fEmb").onclick=e=>{ const b=e.target.closest("[data-emb]"); if(!b) return; state.filters.embalse=b.dataset.emb; renderFilters(); renderData(); };
  $("#fIvh").onclick=e=>{ const b=e.target.closest("[data-ivh]"); if(!b) return; state.filters.ivh = state.filters.ivh===b.dataset.ivh?"":b.dataset.ivh; renderFilters(); renderData(); };
  [["#fDist","distrito"],["#fTipo","tipo"],["#fEstado","estado"],["#fFranja","franja"]].forEach(([s,k])=>$(s).onchange=e=>{ state.filters[k]=e.target.value; renderData(); });
  const clear=()=>{ state.filters={q:"",embalse:"",distrito:"",tipo:"",estado:"",franja:"",ivh:"",stat:"",origen:"",alerta:""}; $("#q").value=""; renderFilters(); renderData(); };
  $("#clearF").onclick=clear;
  $("#stats").onclick=e=>{ const b=e.target.closest("[data-stat]"); if(!b) return; const k=b.dataset.stat; state.filters.stat = state.filters.stat===k?"":k; renderData(); };
  $("#list").onclick=e=>{ if(e.target.id==="clearF2") return clear(); if(e.target.id==="moreBtn"){ state.listLimit+=150; renderList(); return; } const it=e.target.closest(".item"); if(it) select(it.dataset.code); };
  $("#legend").addEventListener("change",e=>{ if(e.target.id==="colorBy"){ state.colorBy=e.target.value; saveSoon(); renderData(); } });
  $("#tabList").onclick=()=>setTab("list");
  $("#tabSum").onclick=()=>setTab("sum");
  $("#tabHy").onclick=()=>setTab("hy");
  document.querySelectorAll("input[name=base]").forEach(r=>r.onchange=()=>setBase(r.value));
  $("#lyDist").onchange=e=>e.target.checked?map.addLayer(overlay.dist):map.removeLayer(overlay.dist);
  $("#lyWater").onchange=e=>e.target.checked?map.addLayer(overlay.water):map.removeLayer(overlay.water);
  $("#lyRoads").onchange=e=>e.target.checked?map.addLayer(overlay.roads):map.removeLayer(overlay.roads);
  $("#lyStations").onchange=e=>e.target.checked?map.addLayer(overlay.stations):map.removeLayer(overlay.stations);
  $("#fOrig").onclick=e=>{ const b=e.target.closest("[data-orig]"); if(!b) return; state.filters.origen=b.dataset.orig; renderFilters(); renderData(); };
  $("#lyLabels").onchange=()=>{ updateLabels(); if($("#lyLabels").checked) map.addLayer(overlay.dams); else map.removeLayer(overlay.dams); };
  document.addEventListener("keydown",e=>{ if(e.key!=="Escape") return; if($("#overlay")) return closeModal(); if(state.mode==="placing") return setMode("view"); if(state.moving) return cancelMove(); if(state.editing) return; if(state.selected) closeDrawer(); });
  const onTheme=()=>{ readPalette(); restyleBase(); drawScen(); renderData(); renderDrawer(); };
  try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",onTheme); }catch(e){}
  new MutationObserver(onTheme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
}

/* ============================================================
   INICIO
   ============================================================ */
function boot(){
  if(typeof L==="undefined"){ document.getElementById("map").innerHTML='<div class="empty" style="padding:60px 20px">No se pudo cargar la biblioteca del mapa. Revisá la conexión a internet y recargá la página.</div>'; return; }
  readPalette(); load(); loadScen(); hyLoad(); state.base="carto";
  if(state.colorBy==="exposicion" && !scen.active) state.colorBy="ivh";
  initMap(); buildStations(); bindUI(); renderRefs(); renderScenCard(); drawScen();
  if(hy.auto) applyAutoLevel(false);
  map.setView([-25.28,-55.12],10);
  renderAll(); updateLabels(); fitAll();
}
boot();
</script>
